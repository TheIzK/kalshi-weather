spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/kalshi_signals
    username: kalshi
    password: localdev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

ingestion:
  schedule:
    initial-delay-ms: 5000
    fixed-delay-ms: 900000 # 15 minutes
    settlement-check-delay-ms: 3600000 # 1 hour — settlement doesn't need 15-min granularity

mlb:
  schedule:
    daily-refresh-cron: "0 0 7 * * *" # 7am America/New_York — schedule, pitchers, stats, standings
    initial-delay-ms: 10000
    hourly-recheck-delay-ms: 3600000 # re-checks for pitcher scratches, then re-evaluates signals
